REMOTE=git@github-imessage-server:mkotik/imessage-server.git
LIVE_DIR=/opt/imessage-server
LIVE_OWNER=root:root
# ingest first: it applies pending schema migrations on start.
SERVICES="imessage-ingest imessage-mcp"
UNIT_FILES="deploy/imessage-ingest.service deploy/imessage-mcp.service deploy/imessage-backup.service deploy/imessage-backup.timer deploy/imessage-restore-check.service deploy/imessage-restore-check.timer"
TEST_CMD="node --test --test-concurrency=1 dist/test/*.test.js"
HEALTH='curl -fsS -o /dev/null http://127.0.0.1:3100/health && curl -fsS -o /dev/null http://127.0.0.1:3200/health'
# The SQLite driver ships prebuilt binaries (prebuilds/linux-arm64.node) but also a
# binding.gyp, which makes npm try to compile it; the box has no toolchain by design.
NPM_CI_FLAGS="--ignore-scripts"
