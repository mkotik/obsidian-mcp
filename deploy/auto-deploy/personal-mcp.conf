REMOTE=git@github-personal-mcp:mkotik/personal-mcp.git
LIVE_DIR=/home/ubuntu/obsidian-mcp
LIVE_OWNER=ubuntu:ubuntu
SERVICES="obsidian-mcp"
UNIT_FILES="obsidian-mcp.service"
TEST_CMD=""
# Unauthenticated POST must be refused by the Access check (401) once the server is up.
HEALTH='[ "$(curl -s -o /dev/null -w %{http_code} -X POST http://127.0.0.1:3000/mcp)" = 401 ]'
